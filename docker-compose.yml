services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firmcore-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STORAGE_DIR=/app/storage
      - TOOLS_DIR=/app/tools
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-512}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    volumes:
      - ./storage:/app/storage
      - ./tools:/app/tools:ro
      - backend-db:/app/data
    # binwalk, grype는 컨테이너 내 설치 (Dockerfile 참고)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firmcore-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend-db:
    driver: local
